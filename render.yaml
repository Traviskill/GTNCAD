services:
  - type: web
    name: gtn-rp-cad
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: gtn-rp-cad-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_FILE
        value: /var/data/gtn-cad.sqlite
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TEMP_STAFF_USERNAME
        sync: false
      - key: TEMP_STAFF_PASSWORD
        sync: false
      - key: TEMP_STAFF_DISPLAY_NAME
        value: Temporary Staff
      - key: TEMP_STAFF_DEPARTMENT
        value: us
